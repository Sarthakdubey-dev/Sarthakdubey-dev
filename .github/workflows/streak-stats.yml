
name: Update GitHub Streak

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout profile repository
        uses: actions/checkout@v6

      - name: Generate Tokyo Night streak
        uses: zients/github-readme-streak-stats@v2
        with:
          options: user=Sarthakdubey-dev&theme=tokyonight&disable_animations=true
          path: profile/streak.svg
          token: ${{ secrets.GH_STATS_TOKEN }}

      - name: Commit generated SVG
        run: |
          git add profile/streak.svg

          if git diff --cached --quiet; then
            echo "No streak changes."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: update GitHub streak"
          git push
